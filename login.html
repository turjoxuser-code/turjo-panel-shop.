<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · TURJO PANEL SHOP</title><link rel="stylesheet" href="style.css"></head><body data-page="login"><div class="wrap"><header class="top"><a class="brand" href="index.html">TURJO PANEL SHOP 📍</a><a class="btn alt" href="index.html">Home</a></header><main class="form-card"><h2>Welcome back</h2><p class="muted">Sign in with your email to purchase and view orders.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="email"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button class="btn" style="width:100%;margin-top:16px">Login</button></form><p id="message" class="small"></p><hr style="border:0;border-top:1px solid #f3d8e7;margin:24px 0"><h3>Create account</h3><form id="registerForm"><label>Email</label><input id="regEmail" type="email" required><label>Password (at least 6 characters)</label><input id="regPassword" type="password" minlength="6" required><button class="btn alt" style="width:100%;margin-top:14px">Register with Gmail</button></form><p id="regMessage" class="small"></p></main></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script><script src="firebase-config.js"></script><script src="app.js"></script></body></html>
